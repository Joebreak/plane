name: Deploy Supabase Functions

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "請先在 GitHub Secrets 設定 SUPABASE_ACCESS_TOKEN 與 SUPABASE_PROJECT_REF"
            exit 1
          fi
          npx supabase functions deploy line-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          npx supabase functions deploy send-message --project-ref "$PROJECT_REF"
          npx supabase functions deploy process-scheduled --project-ref "$PROJECT_REF" --no-verify-jwt
